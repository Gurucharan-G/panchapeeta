name: Django Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "=== Pulling latest code ==="
            sudo -u panchapeethas -H sh -c "cd /opt/panchapeethas/app && git pull origin main"

            echo "=== Installing dependencies ==="
            sudo -u panchapeethas -H sh -c "cd /opt/panchapeethas/app && venv/bin/pip install -r requirements.txt --quiet"

            echo "=== Restarting services (auto-runs migrate + collectstatic) ==="
            sudo systemctl restart panchapeethas
            sudo systemctl restart nginx

            echo "=== Verifying deployment ==="
            sleep 3
            sudo systemctl is-active --quiet panchapeethas && echo "✅ Service is running" || echo "❌ Service failed to start"
