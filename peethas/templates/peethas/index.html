{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Veerashaiva Pancha Peethas — The five sacred seats of the Veerashaiva tradition founded by the Panchacharyas.">
    <title>{% block title %}Veerashaiva Pancha Peethas{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=1.3">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <nav class="nav-links">
                <a href="{% url 'peethas:home' %}" class="nav-link">Home</a>
                <a href="{% url 'peethas:home' %}#divine-heritage" class="nav-link">{{ labels.divine_heritage_title }}</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'peethas:dashboard_home' %}" class="nav-link nav-btn-dashboard">Dashboard</a>
                    <a href="{% url 'peethas:logout' %}" class="nav-link nav-btn-logout">Logout</a>
                {% endif %}
            </nav>
            <div class="lang-selector-container">
                <select onchange="location = this.value;" class="lang-dropdown">
                    <option value="?lang=en" {% if lang == 'en' %}selected{% endif %}>English</option>
                    <option value="?lang=kn" {% if lang == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option>
                    <option value="?lang=mr" {% if lang == 'mr' %}selected{% endif %}>मराठी</option>
                    <option value="?lang=hi" {% if lang == 'hi' %}selected{% endif %}>हिन्दी</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>


    <footer class="site-footer">
        <div class="container">
            <p>&copy; Veerashaiva Pancha Peethas</p>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
